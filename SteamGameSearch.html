<!DOCTYPE html>
<html>
<head>
<title>Steam Frontend File Generator</title>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
  :root {
    --bg: #ffffff;
    --bg-secondary: #f0f8ff;
    --text: #111111;
    --border: #aaaaaa;
    --border-light: #dddddd;
    --input-bg: #ffffff;
    --box-bg: #ffffff;
    --result-hover: #eef0ff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --bg-secondary: #1e2a35;
      --text: #e8e8e8;
      --border: #444444;
      --border-light: #333333;
      --input-bg: #2a2a2a;
      --box-bg: #242424;
      --result-hover: #2a2a3a;
    }
  }

  body { font-family: Arial; margin: 20px; background: var(--bg); color: var(--text); }
  input[type="text"] { padding: 10px; font-size: 16px; margin: 5px; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 3px; }
  button { padding: 10px; font-size: 16px; margin: 5px; cursor: pointer; border-radius: 3px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); }
  button:hover { opacity: 0.85; }
  input[type="radio"], input[type="checkbox"] { accent-color: #4CAF50; }
  .container { display: flex; gap: 20px; margin-top: 20px; }
  .box { flex: 1; max-height: 400px; overflow-y: auto; border: 1px solid var(--border); padding: 10px; background: var(--box-bg); border-radius: 4px; }
  .box h3 { margin-top: 0; color: var(--text); }
  .result { padding: 8px; border-bottom: 1px solid var(--border-light); cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text); }
  .result:hover { background: var(--result-hover); }
  .selected-item { padding: 8px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; background: var(--bg-secondary); color: var(--text); }
  .remove-btn { background: #ff4444; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; font-size: 12px; }
  .remove-btn:hover { background: #cc0000; }
  .add-btn { background: #4CAF50; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; font-size: 12px; }
  .add-btn:hover { background: #45a049; }
  .controls { margin-top: 15px; }
  .file-type { margin: 10px 0; }
  #status { margin: 10px 0; font-weight: bold; }
  .clear-btn { background: #ff9800; color: white; border: none; }
  .clear-btn:hover { background: #e68900; }
</style>
</head>

<body>
<h2>Steam Frontend File Generator</h2>

<button onclick="loadJSON()">Load Local JSON File</button>
<input type="file" id="jsonFile" style="display:none" accept=".json">

<div id="status">Loading games from GitHub...</div>

<input type="text" id="searchBox" placeholder="Search for a game..." oninput="search()" disabled style="width: 400px;">

<div class="container">
  <div class="box">
    <h3>Search Results</h3>
    <div id="results"></div>
  </div>
  
  <div class="box">
    <h3>Selected Games (<span id="selectedCount">0</span>)</h3>
    <button class="clear-btn" onclick="clearSelected()" style="margin-bottom: 10px;">Clear All</button>
    <div id="selected"></div>
  </div>
</div>

<div class="controls">
  <div class="file-type">
    <strong>File Type:</strong>
    <label><input type="radio" name="fileType" value="steam" checked> .steam (ES-DE)</label>
    <label><input type="radio" name="fileType" value="steamappid"> .steamappid (Daijishou)</label>
  </div>

  <div class="file-type">
    <label>
      <input type="checkbox" id="downloadCovers">
      Download cover images
    </label>
  </div>
  
  <button onclick="generateZip()" id="genZip" disabled>
    Generate ZIP
  </button>
</div>

<script>
let storeData = [];
let selectedGames = [];

// Auto-load JSON from GitHub
window.addEventListener('DOMContentLoaded', async function() {
    const url = 'https://raw.githubusercontent.com/Jetup13/steamappid/main/all_steam_store_games.json';
    const statusDiv = document.getElementById("status");
    
    try {
        statusDiv.innerText = "Loading games from GitHub JSON...";
        statusDiv.style.color = "blue";
        
        const response = await fetch(url);
        if (!response.ok) throw new Error('Failed to fetch');
        
        storeData = await response.json();
        statusDiv.innerText = "✓ Auto loaded " + storeData.length + " games from GitHub JSON.";
        statusDiv.style.color = "green";
        document.getElementById("searchBox").disabled = false;
    } catch (err) {
        statusDiv.innerText = "✗ Error loading from GitHub JSON. Use 'Load Local JSON File' instead.";
        statusDiv.style.color = "red";
    }
});

function loadJSON() {
    document.getElementById("jsonFile").click();
}

document.getElementById("jsonFile").addEventListener("change", function() {
    const file = this.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            storeData = JSON.parse(e.target.result);
            document.getElementById("status").innerText = "✓ Loaded " + storeData.length + " games.";
            document.getElementById("status").style.color = "green";
            document.getElementById("searchBox").disabled = false;
        } catch {
            document.getElementById("status").innerText = "✗ Error loading JSON file.";
            document.getElementById("status").style.color = "red";
        }
    };
    reader.readAsText(file);
});

function search() {
    const q = document.getElementById("searchBox").value.toLowerCase();
    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";

    if (q.length < 2) return;

    storeData
      .filter(g => g.name.toLowerCase().includes(q))
      .slice(0, 300)
      .forEach(game => {
        const div = document.createElement("div");
        div.className = "result";
        
        const text = document.createElement("span");
        text.innerText = `${game.name} (AppID: ${game.appid})`;
        
        const btn = document.createElement("button");
        btn.className = "add-btn";
        btn.innerText = "Add";
        btn.onclick = e => {
            e.stopPropagation();
            addGame(game);
        };
        
        div.appendChild(text);
        div.appendChild(btn);
        div.onclick = () => addGame(game);
        resultsDiv.appendChild(div);
    });
}

function addGame(game) {
    if (selectedGames.find(g => g.appid === game.appid)) return;
    selectedGames.push(game);
    updateSelectedDisplay();
}

function removeGame(appid) {
    selectedGames = selectedGames.filter(g => g.appid !== appid);
    updateSelectedDisplay();
}

function clearSelected() {
    if (selectedGames.length && confirm(`Clear all ${selectedGames.length} games?`)) {
        selectedGames = [];
        updateSelectedDisplay();
    }
}

function updateSelectedDisplay() {
    const selectedDiv = document.getElementById("selected");
    const countSpan = document.getElementById("selectedCount");
    const genZipBtn = document.getElementById("genZip");
    
    countSpan.innerText = selectedGames.length;
    selectedDiv.innerHTML = "";
    genZipBtn.disabled = selectedGames.length === 0;

    selectedGames.forEach(game => {
        const div = document.createElement("div");
        div.className = "selected-item";
        div.innerHTML = `
            <span>${game.name} (${game.appid})</span>
            <button class="remove-btn" onclick="removeGame(${game.appid})">Remove</button>
        `;
        selectedDiv.appendChild(div);
    });
}

function sanitize(name) {
    return name.replace(/:/g, " -").replace(/[\\/*?"<>|]/g, "").replace(/\s+/g, " ").trim();
}

async function generateZip() {
    const fileType = document.querySelector('input[name="fileType"]:checked').value;
    const downloadCovers = document.getElementById("downloadCovers").checked;
    const zip = new JSZip();
    const covers = downloadCovers ? zip.folder("covers") : null;

    for (const game of selectedGames) {
        const name = sanitize(game.name);
        zip.file(
            name + "." + fileType,
            fileType === "steam"
                ? game.appid.toString()
                : `# Daijishou Player Template\n[steamappid] ${game.appid}\n...`
        );

        if (downloadCovers && game.boxart) {
            try {
                const r = await fetch(game.boxart);
                if (r.ok) covers.file(name + ".jpg", await r.blob());
            } catch {}
        }
    }

    const blob = await zip.generateAsync({ type: "blob" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const zipName = fileType === "steam" ? "steam_es-de" : "steamappid_daijishou";
    a.download = `${zipName}.zip`;
    a.click();
    URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
